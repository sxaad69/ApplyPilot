# ApplyPilot search configuration
# Copy to ~/.applypilot/searches.yaml and customize for your job search.
# The wizard (applypilot init) generates a basic version automatically.

# Search queries -- each has a query string and priority tier.
# Tier 1: High-priority exact matches (searched first, highest precision)
# Tier 2: Strong matches, broader scope
# Tier 3: Wide net, high volume, lower precision
queries:
  # Tier 1: SDET / QA exact matches (highest precision)
  - query: "SDET"
    tier: 1
  - query: "software development engineer in test"
    tier: 1
  - query: "QA engineer"
    tier: 1
  - query: "QA automation engineer"
    tier: 1
  - query: "quality engineer"
    tier: 1
  - query: "test automation engineer"
    tier: 1
  - query: "software quality engineer"
    tier: 1
  # Tier 2: Strong matches, broader scope
  - query: "test engineer"
    tier: 2
  - query: "automation engineer"
    tier: 2
  - query: "quality assurance automation"
    tier: 2
  - query: "software quality assurance"
    tier: 2
  - query: "test automation"
    tier: 2
  - query: "QA lead"
    tier: 2
  - query: "software engineer in test"
    tier: 2
  # Tier 3: Wide net (SDET roles sometimes posted under these titles)
  - query: "python developer"
    tier: 3
  - query: "software engineer"
    tier: 3
  - query: "playwright"
    tier: 3
  - query: "selenium"
    tier: 3

